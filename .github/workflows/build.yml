name: Build LaTeX Book

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          compiler: xelatex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -synctex=1

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Some-Mathematical-Thinking-PDF
          path: main.pdf
          retention-days: 7
